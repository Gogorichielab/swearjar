name: Azure Static Web Apps CI/CD

# Adopted from the organization workflow template
#   Gogorichielab/.github → workflow-templates/azure-static-web-apps.yml
#   at commit 6599d2688f322bb63a01452e032777d7c0bf6eb9 (merged as dade354).
#
# Repository-specific adaptations (see .github/workflows/README.md):
#   * Filename is load-bearing — the SWA deployment token is bound to it. Do not rename.
#   * app_location: frontend, api_location: api, output_location empty, skip_app_build true.
#   * The API's npm ci prerequisite runs before the deploy step.
#   * Both upload and close use the app-specific PURPLE_FOREST token.
#   * The github_id_token (OIDC) flow the starter omits is retained.
#   * skip_deploy_on_missing_secrets plus a non-fatal token check keeps the
#     repository's "skip, don't fail, when the token is absent" policy.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  SWA_APP_LOCATION: frontend
  SWA_API_LOCATION: api
  SWA_OUTPUT_LOCATION: ''

jobs:
  build_and_deploy_job:
    # Fork and Dependabot PRs must use secret-free CI; never switch to pull_request_target.
    # Internal PR previews stay off until the repository variable SWA_ENABLE_PREVIEWS is 'true'.
    if: >-
      (github.event_name != 'pull_request' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       vars.SWA_ENABLE_PREVIEWS == 'true')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    timeout-minutes: 30
    permissions:
      id-token: write   # required for the github_id_token flow below
      contents: read
      pull-requests: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
          lfs: false

      - name: Install API dependencies
        run: cd api && npm ci

      - name: Check deployment token
        id: token_check
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_FOREST_00C60BC0F }}
        run: |
          if [ -n "$SWA_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SWA deployment token unavailable; skipping deployment."
          fi

      - name: Get Id Token
        id: idtoken
        if: steps.token_check.outputs.present == 'true'
        run: |
          set -euo pipefail
          response=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")
          token=$(printf '%s' "$response" | jq -r '.value // empty')
          if [ -z "$token" ]; then
            echo "::error::Failed to obtain a GitHub OIDC id token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "result=$token" >> "$GITHUB_OUTPUT"

      - name: Build And Deploy
        id: builddeploy
        if: steps.token_check.outputs.present == 'true'
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_FOREST_00C60BC0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Repository/Build Configurations ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: ${{ env.SWA_APP_LOCATION }}      # App source code path
          api_location: ${{ env.SWA_API_LOCATION }}      # Api source code path - optional
          output_location: ${{ env.SWA_OUTPUT_LOCATION }} # Built app content directory - optional
          skip_app_build: true # Frontend is static HTML/CSS/JS, no build needed
          skip_deploy_on_missing_secrets: true # Don't fail deploys when the SWA token isn't available in the env
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######
        env:
          # Custom app settings for the SWA managed API (platform-reserved keys are not allowed here)
          AZURE_TABLES_CONNECTION_STRING: ${{ secrets.AZURE_TABLES_CONNECTION_STRING }}
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
          DEPLOYMENT_STORAGE_CONNECTION_STRING: ${{ secrets.DEPLOYMENT_STORAGE_CONNECTION_STRING }}
          SWEARJAR_TABLE_NAME: ${{ secrets.SWEARJAR_TABLE_NAME }}
          DATE_TIME_MODE: ${{ secrets.DATE_TIME_MODE }}

  close_pull_request_job:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      vars.SWA_ENABLE_PREVIEWS == 'true'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    timeout-minutes: 10
    permissions: {}
    environment: preview
    steps:
      # No checkout or execution of pull request code is needed for cleanup.
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          action: "close"
          app_location: ${{ env.SWA_APP_LOCATION }}
          # Same app/token as the upload job — resolves the previous generic-token mismatch.
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_FOREST_00C60BC0F }}
          skip_deploy_on_missing_secrets: true
